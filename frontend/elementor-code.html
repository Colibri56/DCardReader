            if ('payment' === formKind) {
                console.log('[DCard Account] payment form (4753) - token saved, redirecting to Cardcom ourselves (Elementor\'s own Redirect action was removed - it can\'t read localStorage to build the URL dynamically).');

                // forceClosePopupById - לא closePopup({}, e) - ר' תיקון
                // באג 13/14 למעלה: ה-API הישיר הזה כשל בדרכים שונות
                // ולא קשורות כל פעם שנוסה (כולל קורבנות צד: "n.getModal
                // is not a function" על פופאפ *אחר*). לא עוד try/catch
                // עם API גולמי - ישר הדרך הבטוחה, בדיוק כמו לעיל ל-4749.
                forceClosePopupById(4753);

                // response.data.dcardUserId הוא המקור הטרי ביותר (מגיע
                // ישר מהתשובה הזו) - עדיף על לקרוא בחזרה מ-localStorage
                // (ששמרנו אליו רק שורות מעלה, אבל אין טעם לקרוא במקום
                // להשתמש בערך שכבר בידינו). dcardGetLS כ-fallback בלבד,
                // ליתר ביטחון, אם מאיזושהי סיבה השדה הזה חסר בתשובה הזו.
                const userId = response.data.dcardUserId || dcardGetLS(DCARD_LS_KEYS.userId);
                if (!userId) {
                    console.error('[DCard Account] no userId available - cannot build the Cardcom redirect URL. Staying on the page.');
                    return;
                }

                // תיקון: קארדקום לא מחזירה ExternalId בכלל במוצר הזה -
                // ReturnValue הוא הפרמטר הסטנדרטי של קארדקום עצמה ל"נוסע
                // סמוי" שחוזר בדיוק כמו שנשלח ב-IPN (ר' payment_webhook_
                // inner ב-class-dcard-rest-controller.php, שקורא אותו
                // משם כעת) - לא תלוי באימייל, שיכול להשתנות במסך התשלום.
                const cardcomRedirectUrl = CARDCOM_PAYMENT_URL + '?ReturnValue=' + encodeURIComponent(userId);
                // דרוש: לבדוק בעיניים שה-ReturnValue באמת מצורף לפני
                // שהדף עוזב - ר' החקירה למה קארדקום לא מחזירה אותו ב-IPN.
                console.log('[DCard Account] redirecting to Cardcom:', cardcomRedirectUrl);
                window.location.href = cardcomRedirectUrl;
                return;
            }
          } catch (err) {
              // ר' ההערה מעל ה-listener הזה - חריגה כאן לא אמורה לעולם
              // להגיע לכאן בפועל (ה-guard בתחילת הפונקציה מטפל בכל מקרה
              // הצפוי), אבל אם בכל זאת קרה משהו לא צפוי - נרשם ל-console
              // ונבלע בשקט, לא מופץ החוצה כדי לא לפגוע בהנדלרים אחרים.
              console.error('[DCard Account] unexpected error in submit_success handler (swallowed, not propagated):', err);
          }
        });
    }

    // 1ב. הכתבה קולית (Web Speech API) - כפתורי מיקרופון בתיבת השאלה ובצ'אט.
    // כל שגיאה מוצגת עם alert() חוסם (לא הודעה שקטה שאפשר לפספס) ונרשמת
    // ל-console עם prefix [DCard Voice] כדי שקל יהיה לסנן ב-DevTools.
    function micErrorMessage(errorCode) {
        switch (errorCode) {
            case 'not-allowed':
            case 'permission-denied':
                return 'אנא אשר גישה למיקרופון בהגדרות הדפדפן';
            case 'audio-capture':
                return 'לא נמצא מיקרופון פעיל במחשב. יש לוודא שמיקרופון מחובר ונבחר בהגדרות המערכת.';
            case 'no-speech':
                return 'לא זוהה דיבור. נסה שוב ודבר בסמוך למיקרופון.';
            case 'network':
                return 'בעיית רשת בזיהוי הדיבור. נסה שוב.';
            case 'aborted':
                return null; // עצירה יזומה על ידי המשתמש עצמו (לחיצה חוזרת) - לא שגיאה, לא מציגים alert.
            default:
                return 'לא הצלחנו להפעיל הכתבה קולית. נסה שוב.';
        }
    }

    // מוקצה בפועל בתוך setupVoiceInput() למטה - נשאר null אם הדפדפן לא תומך
    // ב-Web Speech API בכלל. נבדק (guard) בכל מקום שמשתמש בו.
    let chatMicController = null;
    let questionMicController = null;

    (function setupVoiceInput() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        // הדפדפן לא תומך בכלל - שני הכפתורים נשארים מוסתרים (display:none
        // מה-HTML) כדי לא לבלבל, ומציגים alert חד-פעמי שמסביר את זה.
        if (!SpeechRecognition) {
            console.warn('[DCard Voice] Web Speech API not supported in this browser.');
            alert('הכתבה קולית לא נתמכת בדפדפן הזה. אפשר להמשיך ולכתוב באופן רגיל.');
            return;
        }

        // מצמיד הכתבה קולית לכפתור+שדה נתון. כל כפתור מקבל מופע recognition
        // נפרד משלו, כי בכל רגע נתון רק אחד מהם יכול להיות פעיל בפועל
        // (המשתמש לוחץ על כפתור אחד בכל פעם), אבל ככה אין תלות ביניהם.
        function attachVoiceButton(btn, inputEl, label) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            // continuous=true: המיקרופון נשאר פתוח ולא נסגר אוטומטית על השהייה
            // קצרה בדיבור (זה מה שגרם לקיטוע אחרי 2-3 מילים אצל מי שמדבר לאט) -
            // ההקלטה נעצרת רק בלחיצה חוזרת על הכפתור, לא מעצמה.
            recognition.continuous = true;
            // interimResults=false בכל הפלטפורמות: מקבלים רק טקסט סופי, כשהמשתמש
            // מסיים משפט. זה מונע את כפילויות המילים שנצפו ב-Chrome לאנדרואיד
            // (המנוע צובר טיוטות). החיווי החזותי בזמן ההאזנה - ר' .mic-wave ב-CSS.
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            let isRecording = false;
            // התוכן שכבר היה בשדה לפני שהתחילה ההקלטה הנוכחית (לא דורסים אותו).
            // המחרוזת שמוצגת בכל רגע נבנית מחדש מ-event.results (ר' onresult למטה),
            // ולא נצברת לאורך זמן - כך שאירוע כפול/מאוחר לא יכול להכפיל מילים.
            let baseText = '';
            // true רק כשההקלטה נעצרה דרך ה-stop() החיצוני (ר' למטה), לא דרך
            // לחיצה רגילה על כפתור המיקרופון. recognition.stop() אסינכרוני -
            // המנוע עדיין יכול לשגר onresult אחד אחרון עם השארית אחרי שכבר
            // קראנו לו stop(). בלי הדגל הזה, אותו onresult מאוחר כותב מחדש
            // לתוך השדה אחרי שכבר נוקה ונשלח (למשל ע"י "שלח" בצ'אט) - בדיוק
            // הבאג של "ההקלטה האחרונה נשארת בתיבה למרות שהיא כבר נשלחה".
            let suppressTrailingResult = false;

            btn.style.display = '';

            btn.addEventListener('click', () => {
                if (inputEl.readOnly || inputEl.disabled) return; // השדה נעול, אין למה להכתיב
                if (isRecording) {
                    recognition.stop();
                    return;
                }
                baseText = inputEl.value.trim();
                try {
                    recognition.start();
                } catch (e) {
                    // start() זורק אם כבר רץ (למשל לחיצה כפולה מהירה) - מתעלמים.
                    console.log(`[DCard Voice] (${label}) start() threw - likely already running`, e);
                }
            });

            recognition.onstart = () => {
                isRecording = true;
                suppressTrailingResult = false; // הקלטה חדשה - מתחילים נקי
                btn.classList.add('recording');
                console.log(`[DCard Voice] (${label}) onstart - listening (continuous)...`);
            };

            recognition.onresult = (event) => {
                if (suppressTrailingResult) {
                    console.log(`[DCard Voice] (${label}) onresult - מתעלמים: ההקלטה נעצרה חיצונית (למשל ע"י "שלח") והשדה כבר נוקה.`);
                    return;
                }
                // בונים את כל הטקסט מחדש מ-event.results בכל אירוע (מאפס, לא צובר).
                // קטעים סופיים מצטרפים; הטיוטה האחרונה (לא סופית) מחליפה את הקודמת.
                // כך התוצאה זהה לא משנה איך המנוע מחלק את התוצאות בין אירועים -
                // וזה מה שמונע כפילויות במובייל.
                let finalText = '';
                let interimText = '';
                for (let i = 0; i < event.results.length; i++) {
                    const result = event.results[i];
                    const transcript = result[0].transcript.trim();
                    if (!transcript) continue;
                    if (result.isFinal) {
                        finalText = finalText ? `${finalText} ${transcript}` : transcript;
                    } else {
                        interimText = transcript;
                    }
                }

                inputEl.value = [baseText, finalText, interimText].filter(Boolean).join(' ');

                console.log(`[DCard Voice] (${label}) onresult - final: "${finalText}", interim: "${interimText}"`);
            };

            recognition.onerror = (event) => {
                isRecording = false;
                btn.classList.remove('recording');
                console.error(`[DCard Voice] (${label}) onerror:`, event.error, event);
                const message = micErrorMessage(event.error);
                if (message) {
                    alert(message);
                }
            };

            recognition.onend = () => {
                isRecording = false;
                btn.classList.remove('recording');
                console.log(`[DCard Voice] (${label}) onend`);
            };

            // נחשף החוצה כדי שקוד אחר (לחיצה על "שלח") יוכל לכבות הקלטה
            // פעילה מבלי לגעת בפרטי המימוש של recognition/isRecording כאן.
            // מסמן suppressTrailingResult=true לפני ה-stop() עצמו (לא אחריו) -
            // כדי לכסות גם את ה-onresult האחרון שעלול להגיע אחרי שה-stop()
            // האסינכרוני כבר נקרא.
            return {
                stop() {
                    if (isRecording) {
                        suppressTrailingResult = true;
                        recognition.stop();
                    }
                },
                // נחשף כדי שמאזיני ה-Enter על userQuestion/chatInput (ר' למטה)
                // יידעו אם ה-Enter הנוכחי צריך לעצור הקלטה (ולהציג את הטקסט
                // שכבר נכתב לתיבה ע"י onresult, בלי לשלוח/לערבב) או להתנהג
                // כרגיל (שליחה/ערבוב) כשאין הקלטה פעילה כלל.
                isRecording() {
                    return isRecording;
                }
            };
        }

        questionMicController = attachVoiceButton(btnMic, userQuestion, 'question'); // בלוק 1: תיבת השאלה
        chatMicController = attachVoiceButton(btnMicChat, chatInput, 'chat'); // בלוק 4: שיחה אישית עם ה-AI
        // שורת משוב מאקרו (בלוק 5) - document.getElementById ישיר, לא קבוע
        // feedbackMacroText (שמוכרז רק מאוחר יותר בקובץ, ליד handler
        // השליחה) - כדי לא להיתקע על תלות סדר הכרזות.
        if (btnMicFeedback) {
            attachVoiceButton(btnMicFeedback, document.getElementById('feedback-macro-text'), 'feedback');
        }
    })();

    // 2. פונקציות עזר לבניית בועות צ'אט
    function appendMessage(role, text) {
        // עוצר את סבב הטקסטים המתחלפים (clearInterval) ומסיר את חיווי ה"מקליד",
        // אם הם מוצגים - זה קורה תמיד לפני שמוצגת כל הודעה חדשה, ולכן בפועל
        // תמיד ברגע שמגיעה תשובה מה-API (הצלחה או שגיאה).
        stopTyping();

        const msgDiv = document.createElement('div');
        msgDiv.className = 'dcard-bubble';
        msgDiv.style.margin = "10px 0";
        msgDiv.style.padding = "12px 18px";
        msgDiv.style.borderRadius = "15px";
        msgDiv.style.maxWidth = "85%";
        msgDiv.style.display = "inline-block";
        msgDiv.style.lineHeight = "1.5";

        if (role === 'user') {
            msgDiv.style.background = "#f1f1f1";
            msgDiv.style.color = "#333";
            msgDiv.style.float = "left"; // יישור למשתמש
            msgDiv.style.borderBottomLeftRadius = "2px";
        } else {
            msgDiv.style.background = "#8B1E3F";
            msgDiv.style.color = "white";
            msgDiv.style.float = "right"; // יישור לסוכן ה-AI
            msgDiv.style.borderBottomRightRadius = "2px";
        }

        // תיקון אבטחה (QA 4.1): לא innerHTML - text הוא קלט לא-בטוח (גם מה
        // שהמשתמש הקליד בעצמו, גם מה שה-AI מחזיר) ועלול להכיל HTML/JS.
        // בונים את שבירות השורה כאלמנטים אמיתיים, והטקסט עצמו תמיד כ-text
        // node - בלתי ניתן לפרשנות כ-HTML לעולם, תהיה התוכן שלו אשר יהיה.
        const lines = String(text).split('\n');
        lines.forEach(function (line, index) {
            msgDiv.appendChild(document.createTextNode(line));
            if (index < lines.length - 1) {
                msgDiv.appendChild(document.createElement('br'));
            }
        });

        const wrapper = document.createElement('div');
        wrapper.style.overflow = "hidden";
        wrapper.style.clear = "both";
        wrapper.style.width = "100%";
        wrapper.style.position = "relative"; // ר' position:absolute על feedbackRow למטה
        wrapper.appendChild(msgDiv);

        // משוב מיקרו (לייק/דיסלייק) - רק על הודעות AI, לא על הודעות המשתמש
        // עצמו. messageId נשמר על ה-bubble (לא רק במשתנה מקומי) למקרה שיהיה
        // צורך לאתר אותו מבחוץ בעתיד.
        if (role === 'ai') {
            const messageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            msgDiv.dataset.messageId = messageId;

            // תיקון UI (דווח בפועל: "להסיט שמאלה ליד הבועה... לקרב אותם
            // ושייראו בולטים יותר") - פיל (pill) עדין - ר' .dcard-feedback-pill
            // ב-CSS. בעבר צף מתחת לבועה (clear:both) - עכשיו יושב לצידה
            // (ר' aiRow למטה, שבנוי ב-flex ולא ב-float).
            const feedbackRow = document.createElement('div');
            feedbackRow.className = 'dcard-feedback-pill';

            const likeBtn = document.createElement('button');
            likeBtn.type = 'button';
            likeBtn.textContent = '👍';
            likeBtn.className = 'dcard-feedback-btn';
            likeBtn.style.border = 'none';
            likeBtn.style.background = 'transparent';
            likeBtn.style.cursor = 'pointer';
            likeBtn.style.fontSize = '24px';

            const dislikeBtn = document.createElement('button');
            dislikeBtn.type = 'button';
            dislikeBtn.textContent = '👎';
            dislikeBtn.className = 'dcard-feedback-btn';
            dislikeBtn.style.border = 'none';
            dislikeBtn.style.background = 'transparent';
            dislikeBtn.style.cursor = 'pointer';
            dislikeBtn.style.fontSize = '24px';

            // מניעת שליחה כפולה: שני הכפתורים מושבתים אחרי הלחיצה הראשונה
            // על אחד מהם, בלי קשר להצלחת ה-fetch - זו בחירת המשתמש, לא
            // תלויה ברשת.
            function handleFeedbackClick(value, chosenBtn, otherBtn) {
                likeBtn.disabled = true;
                dislikeBtn.disabled = true;
                chosenBtn.style.opacity = '1';
                otherBtn.style.opacity = '0.3';
                sendMicroFeedback(messageId, value);
            }
            likeBtn.addEventListener('click', function () { handleFeedbackClick('like', likeBtn, dislikeBtn); });
            dislikeBtn.addEventListener('click', function () { handleFeedbackClick('dislike', dislikeBtn, likeBtn); });

            feedbackRow.appendChild(likeBtn);
            feedbackRow.appendChild(dislikeBtn);

            // תיקון UI (דווח בפועל: "חייבות להיות בצד שמאל, ממש להצמיד
            // לדופן השמאלית... ואסור להקטין אותם בשום תנאי") - גרסה קודמת
            // (flex, row-reverse) קשרה את מיקום הפיל לרוחב הבועה - כשהבועה
            // הייתה רחבה, ה-flex-shrink הפנימי כיווץ את הפיל (זה מה שנראה
            // כ"הקטנה" בין הודעות שונות). עכשיו position:absolute במקום
            // flex - לגמרי מנותק מרוחב/גודל הבועה, אז הגודל קבוע תמיד
            // ואף פעם לא מצטמצם. left:0 מצמיד ל*דופן* השמאלית של wrapper
            // (לא רק "ליד הבועה") - גם אם הבועה קצרה ומשאירה הרבה מקום ריק.
            // bottom:0 (ביחס ל-wrapper, שה-overflow:hidden שלו כבר גורם לו
            // לקבל בדיוק את גובה הבועה הצפה) - מצמיד לקו התחתון של הבועה.
            feedbackRow.style.position = 'absolute';
            feedbackRow.style.left = '0';
            feedbackRow.style.bottom = '0';
            wrapper.appendChild(feedbackRow);
        }

        chatHistory.appendChild(wrapper);
        chatHistory.scrollTop = chatHistory.scrollHeight;

        // מחזיר את ה-bubble עצמו (לא ה-wrapper) - נדרש כדי שקוד אחר (מעבר
        // חלק למצב "שיחה פתוחה" אחרי הודעת "קבלת מסר", ר' runCardAI למטה)
        // יוכל להוסיף לתוכו שורה נוספת בהמשך, בלי ליצור בועה נפרדת.
        return msgDiv;
    }

    // חיווי המתנה: אנימציית שלוש נקודות (ללא טקסט) שמתחלפת כל 3.5 שניות
    // בין "אנכיים" ל"אופקיים" (ר' .dcard-typing-dots ב-<style> למעלה) -
    // תיקון "משעמם, אין תחושת התקדמות": לא עוד התקדמות חד-כיוונית לפי
    // זמן, אלא מחזור שממשיך כל עוד ה-AI לא ענה.
    //
    // typingModeInterval נשמר כדי שיבוטל ב-stopTyping ברגע שמגיעה תשובה -
    // אחרת הוא ימשיך לרוץ ברקע לנצח גם אחרי שהחיווי כבר הוסר מה-DOM.
    let typingModeInterval = null;

    // עוצר את מחזור ההחלפה ומסיר את חיווי ה"מקליד" מה-DOM, אם הוא מוצג.
    // נקראת בתחילת appendMessage() - כלומר ברגע שמגיעה תשובה מה-API (הצלחה
    // או שגיאה), ולכן המחזור תמיד נעצר בדיוק כשיש תגובה.
    function stopTyping() {
        clearInterval(typingModeInterval);
        typingModeInterval = null;
        const typingInd = document.getElementById('typing-indicator');
        if (typingInd) typingInd.remove();
    }

    // מחליף את מחלקת המצב של נקודות ההמתנה (ר' CSS: stage-vertical / stage-horizontal).
    function setTypingStage(dotsEl, stageClass) {
        dotsEl.classList.remove('stage-vertical', 'stage-horizontal');
        dotsEl.classList.add(stageClass);
    }

    function showTyping() {
        stopTyping(); // מנקה חיווי/סבב קודם אם קיים, לפני שמתחילים חדש

        const msgDiv = document.createElement('div');
        msgDiv.id = "typing-indicator";
        msgDiv.style.margin = "10px 0";
        msgDiv.style.padding = "10px 15px";
        msgDiv.style.borderRadius = "15px";
        msgDiv.style.background = "#e0e0e0";
        msgDiv.style.color = "#555";
        msgDiv.style.float = "right";
        msgDiv.style.clear = "both";
        msgDiv.style.display = "flex";
        msgDiv.style.alignItems = "center";
        msgDiv.style.gap = "8px";

        const dots = document.createElement('span');
        dots.className = 'dcard-typing-dots stage-vertical'; // מתחילים תמיד מ"אנכיים"
        dots.innerHTML = '<span></span><span></span><span></span>';

        // מחליף בין "אנכיים" ל"אופקיים" כל 3.5 שניות, כל עוד ההמתנה נמשכת.
        let typingMode = 'vertical';
        typingModeInterval = setInterval(function () {
            typingMode = ('vertical' === typingMode) ? 'horizontal' : 'vertical';
            setTypingStage(dots, 'stage-' + typingMode);
        }, 3500);
        msgDiv.appendChild(dots);

        const wrapper = document.createElement('div');
        wrapper.style.overflow = "hidden";
        wrapper.style.width = "100%";
        wrapper.appendChild(msgDiv);

        chatHistory.appendChild(wrapper);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // בחירה אקראית של קלף באמצעות crypto.getRandomValues, עם rejection
    // sampling כדי למנוע הטיית modulo (0x100000000 לא מתחלק ב-72).
    function secureRandomCardId() {
        const limit = Math.floor(0x100000000 / TOTAL_CARDS) * TOTAL_CARDS;
        const buf = new Uint32Array(1);
        do {
            crypto.getRandomValues(buf);
        } while (buf[0] >= limit);
        return (buf[0] % TOTAL_CARDS) + 1;
    }

    // תאריך מקומי (לא UTC) בפורמט YYYY-MM-DD - "היום" מוגדר לפי שעון
    // המשתמש, כמו שהבקשה המקורית ("עד 5 סשנים עוקבים באותו היום") מתכוונת.
    function dcardTodayKey() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function loadRecentCardHistory() {
        try {
            const raw = dcardGetLS(DCARD_LS_KEYS.recentCardHistory);
            const parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    }

    // נקרא כל פעם שנשלף קלף בפועל (ר' appState === 'shuffling' למטה) -
    // מוסיף אותו לרשומת הסשן הנוכחי בהיסטוריה (לפי sessionToken+תאריך),
    // ושומר רק את 5 הרשומות האחרונות *של היום* (רשומות של ימים קודמים
    // לא רלוונטיות לחסימה ומושמטות, כדי שה-localStorage לא יתפח לנצח).
    function recordCardInHistory(cardId) {
        const today = dcardTodayKey();
        const history = loadRecentCardHistory();

        let entry = history.find(function (e) { return e.sessionToken === sessionToken && e.date === today; });
        if (!entry) {
            entry = { sessionToken: sessionToken || null, date: today, cards: [] };
            history.push(entry);
        }
        if (!entry.cards.includes(cardId)) {
            entry.cards.push(cardId);
        }

        const trimmedToday = history.filter(function (e) { return e.date === today; }).slice(-5);
        try {
            localStorage.setItem(DCARD_LS_KEYS.recentCardHistory, JSON.stringify(trimmedToday));
        } catch (e) {
            // פרטי/חסום - ממשיכים בלי לשמור, לא עוצרים את הזרימה (אותה
            // מדיניות כמו dcardSetLS הכללית).
        }
    }

    // קבוצת הקלפים ש"תפוסים" בגלל הסשן הנוכחי + עד 5 סשנים עוקבים היום -
    // drawnCards (הסשן הנוכחי בלבד) נבדק כבר בנפרד, אבל כלול כאן שוב
    // בכוונה (אין נזק מכפילות ב-Set) כדי שאפשר יהיה בעתיד לבדוק רק מול
    // הפונקציה הזו, בלי לזכור שני מקורות נפרדים.
    function recentCardExclusionSet() {
        const today = dcardTodayKey();
        const ids = new Set(drawnCards);
        loadRecentCardHistory()
            .filter(function (e) { return e.date === today; })
            .forEach(function (e) { (e.cards || []).forEach(function (id) { ids.add(id); }); });
        return ids;
    }

    // מציג שוב את הקופה והכפתור רק אם הסוכן הציע קלף נוסף ועוד לא הגענו למקסימום.
    function maybeOfferAnotherCard(nextAction) {
        // 'request_card_draw' מתקבל גם הוא: הסוכן משתמש בו לפעמים כשהוא מסכים לבקשת המשתמש לקלף נוסף.
        const offered = nextAction === 'offer_another_card' || nextAction === 'request_card_draw';
        if (offered && appState === 'drawn' && drawnCards.length < MAX_CARDS) {
            visualDeck.style.display = '';
            btnDeckAction.style.display = '';
            // הקופה נמצאת בראש העמוד והמשתמש מסתכל על הצ'אט, אז מגלגלים אליה.
            visualDeck.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // תיקון (דווח בפועל: "זה עצר את זרימת הדיאלוג והתחיל לערבב קלפים.
            // זה היה מפתיע ולא הייתה בקשה לכך") - התיקון הקודם (ר' היסטוריה
            // למטה) הפעיל כאן beginShuffling() אוטומטית, בלי שום פעולה מצד
            // המשתמש. הבעיה: הפונקציה הזו רצה אחרי *כל* הודעת AI בשיחה
            // (ר' הקריאות אליה), סומכת לגמרי על next_action של המודל -
            // ואם המודל כתב 'offer_another_card'/'request_card_draw' בטעות
            // (או מוקדם מדי), המשתמש נחטף מהשיחה לאנימציה בלי שביקש. עכשיו:
            // רק *מציגים* את הקופה (גלויה, עם גלילה אליה) - לא מתחילים
            // לערבב אוטומטית. המשתמש עצמו לוחץ על הכפתור כשהוא מוכן, בדיוק
            // כמו בשליפת הקלף הראשון (ר' btnDeckAction.addEventListener,
            // שכבר קורא ל-beginShuffling() בעצמו בלחיצה).
            //
            // (היסטוריה: "באג שתוקן" הקודם - קודם הקופה רק 'הופיעה' סטטית
            // בלי שום תנועה, והמסך נראה קפוא. התיקון הזה לא חוזר לזה - הקופה
            // עדיין גלויה ומוזמנת ללחיצה, רק בלי לקחת שליטה על המסך בלי רשות.)
        }
    }

    // מתחיל את אנימציית הערבוב ומעביר את appState ל-'shuffling'. משותף לשני
    // המקומות שמתחילים שליפת קלף: הלחיצה הראשונה על הכפתור (קלף ראשון/הצעה
    // ידנית לקלף נוסף), וההצעה האוטומטית של קלף נוסף מ-maybeOfferAnotherCard.
    function beginShuffling() {
        appState = 'shuffling';
        btnDeckAction.innerText = ( 'female' === userGender ) ? 'בחרי קלף' : 'בחר קלף';
        shuffleMode = 'horizontal'; // תמיד מתחילים מאותו מצב, לעקביות
        shuffleStepCount = 0;
        performShuffleStep();
        shuffleInterval = setInterval(performShuffleStep, 900);
    }

    // נועל את תיבת הכתיבה ומציג הודעת סיום במקומה. נקרא משני מקומות שונים
    // (ר' btnSend), עם טקסט מתאים לכל אחד:
    //   - הסוכן עצמו קבע שהתהליך הסתיים (data.endSession) - יכול לקרות
    //     בכל שלב, ברגע שיש סימן שהמשתמש קיבל תשובה (ר' agent-brain-instructions.md
    //     שלב ט') - זו לא בהכרח השאלה ה-15, ולכן אסור להמשיך לשאול רק כי
    //     "עוד לא הגענו למגבלה".
    //   - הגענו למגבלת 15 השאלות (MAX_USER_QUESTIONS) בלי שהסוכן סיים מעצמו -
    //     רשת ביטחון, השרת כבר אוכף את זה גם כן.
    // המונה מתאפס ממילא בכל טעינה מחדש של העמוד ("שאלה חדשה" עושה location.reload()).
    function lockChatInput(message) {
        chatInputArea.style.display = 'none';

        // תיקון: "השורה בתחתית תיבת השיחה נראית מיותרת" - הסוכן עצמו כבר
        // כותב משפט סגירה מפורש בתוך ההודעה האחרונה שלו (ר' agent-brain-
        // instructions.md שלב ט'), אז הודעה כפולה כאן לא נדרשת. message
        // ריק (או falsy) פשוט נועל את התיבה בלי להוסיף טקסט נוסף מתחתיה -
        // עדיין בשימוש בקריאות אחרות ל-lockChatInput עם טקסט אמיתי (למשל
        // מגבלת שאלות), שם זה עדיין נחוץ.
        if (!message) return;

        if (document.getElementById('chat-limit-message')) return; // כבר מוצג, לא כופלים

        const limitMsg = document.createElement('div');
        limitMsg.id = 'chat-limit-message';
        limitMsg.style.textAlign = 'center';
        limitMsg.style.color = '#8B1E3F';
        limitMsg.style.fontWeight = 'bold';
        limitMsg.style.padding = '10px';
        limitMsg.innerText = message;
        chatInputArea.insertAdjacentElement('afterend', limitMsg);
    }

    // תיקון "דינמיקה לא בולטת מספיק" (ולאחר מכן: "כל 2 עירבובים, לא לפי
    // זמן"): shuffleMode מתחלף כאן, לפי ספירת הטיקים של האנימציה עצמה
    // (shuffleStepCount) - לא setInterval נפרד. 'horizontal' מפעיל את
    // ההחלקה שמאלה/ימינה המקורית, 'bounce' מפעיל קפיצה אנכית (מחלקות CSS
    // חדשות). אותה אסטרטגיה בדיוק (index % 2 לפיצול בין שתי התנועות בכל
    // טיק), רק זוג מחלקות שונה לפי המצב.
    function performShuffleStep() {
        shuffleStepCount++;
        if (0 === shuffleStepCount % 2) {
            shuffleMode = ('horizontal' === shuffleMode) ? 'bounce' : 'horizontal';
        }
        const classA = ('bounce' === shuffleMode) ? 'shuffle-bounce-up' : 'shuffle-left';
        const classB = ('bounce' === shuffleMode) ? 'shuffle-bounce-down' : 'shuffle-right';
        animationCards.forEach((card, index) => {
            setTimeout(() => {
                card.classList.add(index % 2 === 0 ? classA : classB);
            }, index * 100);
        });
        setTimeout(() => {
            animationCards.forEach(card => {
                card.classList.remove('shuffle-left', 'shuffle-right', 'shuffle-bounce-up', 'shuffle-bounce-down');
                card.style.zIndex = Math.floor(Math.random() * 10);
            });
        }, 400);
    }

    // 3. ניהול שליפת הקלפים והפנייה הראשונית למודל
    btnDeckAction.addEventListener('click', async function() {
        if (!sessionToken) {
            // תיקון "נתקע על מבצע התחברות": אם initSession() עדיין לא רצה
            // בכלל, או שרצה ונכשלה (sessionInitiated התאפס ל-false, ר'
            // initSession למעלה) - מנסים כאן ממש, לא רק מתריעים ומוותרים.
            // המשתמש לוחץ שוב ביודעין (הכפתור "ערבוב קלפים"), אז זו בדיוק
            // נקודת ה"ניסיון חוזר" הטבעית, בלי צורך בכפתור "נסה שוב" נפרד.
            if (!sessionInitiated) {
                await initSession();
            }
            if (!sessionToken) {
                alert(sessionInitError || "המערכת מבצעת התחברות לשרת, אנא המתן שניה ונסה שוב.");
                return;
            }
            // חוזר (retry) הצליח - sessionToken קיים כעת, ממשיכים בלי return
            // להמשך ההתנהלות הרגילה של הלחיצה (למטה), לא רק "מתחברים ועוצרים".
        }

        if (appState === 'start' || appState === 'drawn') {
            if (appState === 'start' && userQuestion.value.trim() === "") {
                alert("אנא כתוב את שאלתך לפני שנתחיל.");
                return;
            }
            if (appState === 'start') {
                userQuestion.classList.add('locked');
                userQuestion.readOnly = true;
                btnMic.style.display = 'none'; // השאלה ננעלה, אין יותר למה להכתיב

                // שינוי UX (#1): בועת השאלה מוזרקת מיד ברגע שהמשתמש נועל
                // את השאלה שלו ומתחיל את התהליך - לא מחכה לתשובת ה-AI
                // הראשונה כמו קודם. הפורמט קבוע: שאלת: "...".
                appendMessage('user', `שאלת: "${userQuestion.value.trim()}"`);
            }
            beginShuffling();
            return;
        }

        if (appState === 'shuffling') {
            clearInterval(shuffleInterval);

            let randomCardId;
            if (forceCardId && !drawnCards.includes(forceCardId)) {
                // מצב בדיקה (A/B): הקלף הראשון קבוע. קלפים נוספים חוזרים להגרלה רגילה.
                randomCardId = forceCardId;
            } else {
                // אמון פסיכולוגי: לא חוזרים על קלף מהסשן הנוכחי *או* מעד 5
                // הסשנים הקודמים היום (ר' recentCardExclusionSet למעלה).
                // attempts מוגבל רק כהגנה תיאורטית - עם TOTAL_CARDS=72
                // וחסימה מעשית של לכל היותר כ-18 קלפים (3 בסשן * עד 6
                // סשנים), הלולאה תמיד תמצא קלף פנוי תוך ניסיונות בודדים.
                const excluded = recentCardExclusionSet();
                let attempts = 0;
                do {
                    randomCardId = secureRandomCardId();
                    attempts++;
                } while (excluded.has(randomCardId) && attempts < 200);
            }

            drawnCards.push(randomCardId);
            recordCardInHistory(randomCardId);
            let formattedCardId = String(randomCardId).padStart(2, '0');

            // תצוגת הקלף
            let cardWrapper = document.createElement('div');
            cardWrapper.className = 'card-item';
            let imgElement = document.createElement('img');
            imgElement.className = 'card-display';
            // מאזין load נקבע *לפני* src, כדי שגם אם התמונה כבר בקאש הדפדפן
            // ונטענת כמעט מידית, המאזין כבר רשום ולא נפספס.
            imgElement.addEventListener('load', function () {
                imgElement.classList.add('card-fade-in');
            });
            imgElement.src = `/wp-content/uploads/im_${formattedCardId}.jpg`;
        //    let idLabel = document.createElement('span');
        //    idLabel.className = 'card-id-label';
        //    idLabel.innerText = `(קלף מס' ${formattedCardId})`;
            cardWrapper.appendChild(imgElement);
         //   cardWrapper.appendChild(idLabel);

            // תיקון: כפתור "קלף נוסף" ליד התמונה עצמה - יוזמה של המשתמש,
            // לא רק כש-AI מציע (ר' maybeOfferAnotherCard, שנשאר כפי שהיה -
            // שני המסלולים מובילים לאותה פונקציה). מוצג רק אם עוד לא הגענו
            // למגבלה (MAX_CARDS) - בלי תלות ב-nextAction של הסוכן.
            //
            // תיקון באג (דווח בפועל: "הכפתור נעלם גם בשיחה מפתחת"): הקלף
            // *הראשון* תמיד נוצר *לפני* שהמשתמש בכלל בחר מסלול (בלוק בחירת
            // המסלול מוצג רק אחרי זה) - כלומר chatModeActive עדיין false
            // בדיוק ברגע היצירה שלו, גם אם המשתמש יבחר "שיחה מפתחת" שנייה
            // אחר כך. בדיקה חד-פעמית כאן (if chatModeActive) הייתה שוגה
            // תמיד על הקלף הראשון. הפתרון: הכפתור *תמיד* נוצר (כש-
            // drawnCards.length < MAX_CARDS), אבל מוסתר ב-CSS אם המסלול
            // עדיין לא שיחה - ו-btnPathChat (ר' למטה) חושף אותו רטרואקטיבית
            // ברגע שהמסלול נבחר, גם עבור קלף שכבר מוצג על המסך.
            if (drawnCards.length < MAX_CARDS) {
                const extraCardBtn = document.createElement('button');
                extraCardBtn.type = 'button';
                extraCardBtn.className = 'btn-extra-card';
                if (!chatModeActive) {
                    extraCardBtn.style.display = 'none';
                }
                extraCardBtn.innerText = 'קלף נוסף';
                extraCardBtn.addEventListener('click', function () {
                    extraCardBtn.disabled = true; // חד-פעמי - מונע כמה קליקים בזמן שהערבוב כבר מתחיל
                    maybeOfferAnotherCard('request_card_draw');
                });
                cardWrapper.appendChild(extraCardBtn);
            }

            cardsContainer.appendChild(cardWrapper);

            block3Cards.style.display = 'block';
            block4Chat.style.display = 'block';
            block5Actions.style.display = 'flex';

            if (drawnCards.length < MAX_CARDS) {
                // הקופה/הכפתור המקוריים (btnDeckAction) נשארים מוסתרים - לא
                // מעודדים קלף נוסף באופן בולט; כפתור "קלף נוסף" החדש ליד
                // התמונה (למעלה) הוא הדרך היחידה כעת ליזום את זה ידנית.
                appState = 'drawn';
                btnDeckAction.innerText = ( 'female' === userGender ) ? "שלפי קלף נוסף" : "שלוף קלף נוסף";
                visualDeck.style.display = 'none';
                btnDeckAction.style.display = 'none';
            } else {
                appState = 'max';
                visualDeck.style.display = 'none';
                btnDeckAction.style.display = 'none';
            }

            if (chatModeActive) {
                // כבר בחרו "שיחה אישית" קודם (קלף נוסף שהוצע תוך כדי הצ'אט) -
                // לא חוזרים לבחירת מסלול ולא מסתירים את תיבת ההקלדה שוב,
                // ממשיכים ישר לתגובת ה-AI על הקלף החדש.
                runCardAI(randomCardId, 'chat');
            } else {
                // בכל שליפת קלף ראשון בוחרים קודם מסלול: שיחה אישית או קבלת
                // מסר חד-פעמי. עד לבחירה, תיבת ההקלדה מוסתרת כדי שלא יכתוב
                // לתוכה לפני שהמסלול נקבע.
                pendingCardId = randomCardId;
                chatInputArea.style.display = 'none';
                pathChoiceBlock.style.display = 'flex';
            }
        }
    });

    // מעבר חלק ממסלול "קבלת מסר" (חד-פעמי) ל"שיחה פתוחה" (chat), בלי
    // reload/ניווט - רק הצגת כפתור מתחת להודעת ה-AI שכבר הוצגה, ובלחיצה
    // עליו: הוספת שורה נוספת (gender-aware) *לתוך* אותה בועה עצמה (כאילו
    // הסוכן כתב אותה כחלק מהתשובה), והחלפת מצב הסשן כך שההודעה הבאה של
    // המשתמש תעבור ב-/turn (כמו כל שיחה אישית רגילה) ולא תתחיל קריאה
    // חדשה - chatModeActive הוא הדגל היחיד שמסלול השיחה הרגיל (btnPathChat)
    // כבר קורא לו בכל מקום אחר בקובץ הזה, אז זו לא התנהגות נפרדת.
    function offerDeepenIntoChat(aiBubble) {
        const deepenWrapper = document.createElement('div');
        deepenWrapper.style.clear = 'both';
        deepenWrapper.style.textAlign = 'center';
        deepenWrapper.style.margin = '14px 0';

        const deepenBtn = document.createElement('button');
        deepenBtn.type = 'button';
        deepenBtn.className = 'btn-outline';
        // תיקון: הטקסט כאן חייב להתאים בדיוק למה שמשפט הסיום של "קבלת מסר"
        // מפנה אליו (ר' MESSAGE_MODE_INSTRUCTION ב-class-dcard-rest-controller.php) -
        // אחרת המשתמש מחפש כפתור בשם אחד ורואה כפתור בשם אחר.
        deepenBtn.textContent = 'רוצה להמשיך במסר';
        deepenWrapper.appendChild(deepenBtn);
        chatHistory.appendChild(deepenWrapper);
        chatHistory.scrollTop = chatHistory.scrollHeight;

        deepenBtn.addEventListener('click', function () {
            deepenWrapper.remove(); // לחיצה חד-פעמית - לא רלוונטי יותר אחרי המעבר לשיחה

            // תיקון (דווח בפועל: "השאלה 'מה תרצי לשאול?' צריכה להופיע בבועה
            // חדשה אחרת לא שמים לב אליה כאילו היא חלק מהמסר") - בעבר זו
            // הייתה שורה נוספת *לתוך* בועת המסר הקיימת (ר' ההיסטוריה למעלה
            // על "כאילו הסוכן כתב אותה כחלק מהתשובה"); עכשיו בועת AI נפרדת,
            // דרך appendMessage הרגילה, כדי שתתבלט כפנייה חדשה ולא תיטמע
            // בתוך משפט הסיום הקבוע של המסר.
            const followUpText = ( 'female' === userGender ) ? 'מה תרצי לשאול?' : 'מה תרצה לשאול?';
            appendMessage('ai', followUpText);

            chatModeActive = true; // מכאן ואילך - כמו אחרי btnPathChat - גם בקלפים נוספים
            // תיקון: אותו חשיפה רטרואקטיבית של כפתור "קלף נוסף" כמו ב-
            // btnPathChat - גם כאן (העמקה ממסר לשיחה) יכול להיות קלף כבר
            // מוצג על המסך עם הכפתור מוסתר.
            document.querySelectorAll('.btn-extra-card').forEach(function (btn) {
                btn.style.display = '';
            });
            // תיקון יחידת מדידה: אם הסשן הזה "התעמק" לשיחה פתוחה אחרי
            // קבלת מסר (היה כבר נספר כ-anonMsgCount, ר' runCardAI) -
            // countSessionIfNeeded לא עושה כלום (currentSessionCounted
            // כבר true) - לא נספר פעמיים כ"שני סשנים" על אותה פנייה אחת.
            countSessionIfNeeded(DCARD_LS_KEYS.anonChatCount);
            chatInputArea.style.display = '';
            chatInput.focus();
            chatHistory.scrollTop = chatHistory.scrollHeight;
        });
    }

    // קריאה בפועל ל-AI עבור הקלף שנשלף, לפי המסלול שנבחר.
    async function runCardAI(cardId, mode) {
        showTyping();
        try {
            // תיקון ביצועים: בעבר, עבור הקלף הראשון, הקוד היה שולח שתי
            // בקשות ברצף - card-selected ואז turn נוסף - כלומר שתי
            // קריאות AI מלאות אחת אחרי השנייה לפני שהמשתמש רואה תשובה.
            // זה בדיוק מה שדחף את זמן ההמתנה הכולל מעבר לטיימאאוט של
            // השרת ("תקוע 30 שניות ואז שגיאה"). עכשיו השאלה (רק בקלף
            // הראשון, כשעוד אין state.original_question בסשן) נשלחת
            // כפרמטר בתוך אותה בקשה יחידה ל-card-selected, וה-backend
            // מזין אותה למודל באותה קריאה - AI call אחד בלבד לכל קלף.
            const cardRes = await fetch(`${API_BASE}/card-selected`, {
                method: 'POST',
                headers: dcardHeaders(),
                body: JSON.stringify({
                    session_token: sessionToken,
                    card_id: String(cardId),
                    question: drawnCards.length === 1 ? userQuestion.value.trim() : undefined,
                    mode: mode
                })
            });
            const cardData = await cardRes.json();

            // תיקון: פתיחת קיר התשלום (4753) כשהשרת מחזיר 403/code=
            // credits_exhausted - למשתמש רשום שסיים את הקרדיטים שלו (ר'
            // הסרת הבדיקה המקומית ב-btnPathMessage/btnSend למעלה: עכשיו
            // השרת הוא שמחליט, לא localStorage, אז חייבים להגיב לתשובה שלו).
            if (403 === cardRes.status && 'credits_exhausted' === cardData.code) {
                stopTyping(); // אין appendMessage בענף הזה - חיווט ה"מקליד" לא יתנקה לבד
                // State recovery: שומרים את השאלה המקורית (תיבה 1) כדי
                // שלא תאבד אחרי ניווט מלא לקארדקום וחזרה - ר' DCARD_LS_KEYS.
                // pendingQuestion למעלה ו"שחזור שאלה תקועה" בתחילת הסקריפט.
                if (userQuestion && userQuestion.value && userQuestion.value.trim()) {
                    dcardSetLS(DCARD_LS_KEYS.pendingQuestion, userQuestion.value.trim());
                }
                triggerPaymentWall();
                return;
            }

            if (cardData.aiReply) {
                const aiBubble = appendMessage('ai', cardData.aiReply);
                if (mode === 'chat') {
                    // רק במסלול שיחה אישית יש המשך אפשרי - כולל הצעת קלף נוסף.
                    maybeOfferAnotherCard(cardData.nextAction);
                } else {
                    // תיקון יחידת מדידה: סופרים *סשן* אחד, לא קלף/הודעה -
                    // countSessionIfNeeded לא עושה כלום אם הסשן הזה כבר
                    // נספר (לא רלוונטי כאן בפועל, כי "קבלת מסר" הוא קלף
                    // יחיד לסשן, אבל אותו מנגנון בדיוק כמו בצ'אט, לא הכפלה
                    // מיוחדת). לא בלחיצה על הכפתור (ר' btnPathMessage, שם
                    // נבדקת המגבלה *לפני* הקריאה) - רק אחרי הצלחה בפועל.
                    countSessionIfNeeded(DCARD_LS_KEYS.anonMsgCount);
                    // מסלול "קבלת מסר": אפשרות מעבר חלק לשיחה פתוחה (לא
                    // reload/ניווט) - כפתור מתחת להודעה עצמה, לא בתוכה.
                    offerDeepenIntoChat(aiBubble);
                }
            } else {
                // תיקון: cardData.error הוא טקסט טכני מיועד ללוגים (למשל "המודל
                // לא החזיר JSON תקין גם אחרי ניסיון חוזר") - לא מיועד למשתמש,
                // ולא תואם בכלל את הטון החם שכל ה-prompt בנוי סביבו. תמיד
                // מציגים הודעה ידידותית קבועה, לא את הטקסט הגולמי מהשרת.
                // תיקון נוסף: "נסה שוב" לבדו מטעה אם הכשל חוזר על עצמו בכל
                // ניסיון (לא בעיה חד-פעמית) - עכשיו גם מכוון למוצא בפועל.
                appendMessage('ai', 'אירעה שגיאה בקבלת תגובה. אפשר לנסות שוב, ואם זה חוזר על עצמו - מומלץ ללחוץ על "שאלה חדשה" ולהתחיל מחדש.');
            }
        } catch (e) {
            appendMessage('ai', 'אירעה שגיאה בחיבור למערכת. אפשר לנסות שוב, ואם זה חוזר על עצמו - מומלץ ללחוץ על "שאלה חדשה" ולהתחיל מחדש.');
            console.error(e);
        }
    }

    btnPathChat.addEventListener('click', () => {
        if (pendingCardId === null) return;

        // תיקון יחידת מדידה: הבדיקה (ולא רק הספירה) עברה לכאן - נקודת
        // הכניסה בפועל לשיחה פתוחה, במקום על כל הודעה בתוכה (ר' btnSend).
        // אותו דפוס בדיוק כמו ב-btnPathMessage ממש למעלה.
        if (!dcardIsRegistered() && dcardGetCount(DCARD_LS_KEYS.anonChatCount) >= dcardAnonLimit('chat')) {
            triggerRegistrationWall();
            return;
        }

        countSessionIfNeeded(DCARD_LS_KEYS.anonChatCount);
        chatModeActive = true; // מכאן ואילך תיבת ההקלדה נשארת גלויה גם בקלפים נוספים
        // תיקון: חושף רטרואקטיבית את כפתור "קלף נוסף" שכבר נוצר (מוסתר)
        // על הקלף הראשון - ר' ההערה המלאה למעלה ליד יצירת הכפתור.
        document.querySelectorAll('.btn-extra-card').forEach(function (btn) {
            btn.style.display = '';
        });
        pathChoiceBlock.style.display = 'none';
        chatInputArea.style.display = '';
        const cardId = pendingCardId;
        pendingCardId = null;
        runCardAI(cardId, 'chat');
    });

    btnPathMessage.addEventListener('click', () => {
        if (pendingCardId === null) return;

        // Freemium PLG, שלב 1: בדיקה *לפני* הקריאה בפועל - חוסמים את
        // הקריאה עצמה, לא רק משהו אחריה. משאירים את מסך בחירת המסלול כמו
        // שהוא (לא מאפסים pendingCardId) כדי שעדיין אפשר לבחור "שיחה
        // אישית" במקום, שנספר במגבלה נפרדת (anonChatCount).
        //
        // תיקון: !dcardIsRegistered() - למשתמש רשום, הבדיקה המקומית הזו
        // לא רלוונטית בכלל (ר' ההערה על dcardIsRegistered למעלה) - מדלגים
        // עליה לחלוטין ונותנים לבקשה לצאת לשרת, שאוכף קרדיטים בעצמו.
        if (!dcardIsRegistered() && dcardGetCount(DCARD_LS_KEYS.anonMsgCount) >= dcardAnonLimit('msg')) {
            triggerRegistrationWall();
            return;
        }

        resetUserQuestionCount(); // מסלול קבלת מסר לא כולל שיחה, אבל מאפסים ליתר ביטחון
        pathChoiceBlock.style.display = 'none';
        // תיבת ההקלדה נשארת מוסתרת למשך שאר הסשן - זה מסלול חד-פעמי.
        const cardId = pendingCardId;
        pendingCardId = null;
        runCardAI(cardId, 'message');
    });

    // 4. שליחת הודעת טקסט רגילה בצ'אט
    btnSend.addEventListener('click', async () => {
        // לחיצה על "שלח" מכבה הקלטה פעילה אם הייתה - אין סיבה שהמיקרופון
        // ימשיך להאזין אחרי שהמשתמש כבר החליט לשלוח את מה שכתוב בתיבה.
        if (chatMicController) chatMicController.stop();

        const text = chatInput.value.trim();
        if (!text || !sessionToken) return;
        if (userQuestionCount >= MAX_USER_QUESTIONS) return; // הגיע למגבלה, התיבה כבר אמורה להיות מוסתרת

        // תיקון יחידת מדידה: הבדיקה הועברה לנקודות הכניסה לשיחה פתוחה
        // (btnPathChat/offerDeepenIntoChat, לפני שהסשן בכלל "מחויב" לנתיב
        // הזה) - לא כאן, על כל הודעה בנפרד. סשן שכבר עבר את הבדיקה
        // והתחיל לא נבדק שוב בכל שאלת המשך שלו.

        appendMessage('user', text);
        chatInput.value = '';
        showTyping();
        userQuestionCount++; // סופרים את השליחה בפועל, לפני התשובה - זו השאלה ה-userQuestionCount בדיוק
        // רשת ביטחון בלבד: אם הגענו למגבלת 15 (MAX_USER_QUESTIONS) בלי שהסוכן
        // סיים מעצמו קודם, מסמנים לשרת שזו פנייה אחרונה כדי שיסכם ולא ימשיך לשאול.
        const isFinalTurn = userQuestionCount >= MAX_USER_QUESTIONS;
        let agentEndedConversation = false;
        let creditsExhausted = false; // ר' ה-finally למטה - מונע lockChatInput עם הודעה שגויה אם זה קרה בדיוק בתור האחרון

        try {
            const res = await fetch(`${API_BASE}/turn`, {
                method: 'POST',
                headers: dcardHeaders(),
                body: JSON.stringify({ session_token: sessionToken, message: text, is_final_turn: isFinalTurn })
            });
            const data = await res.json();

            // ר' ההערה המלאה ב-runCardAI למעלה - אותה תגובה ל-403/
            // credits_exhausted. (העדכון ב-session_turn_inner שסגר את
            // הפער הזה בצד השרת בוצע בשלב מאוחר יותר - גם ה-endpoint הזה
            // נאכף כעת, לא רק שליפת קלף.)
            if (403 === res.status && 'credits_exhausted' === data.code) {
                stopTyping();
                creditsExhausted = true;
                // State recovery: text (לא chatInput.value - זה כבר נוקה
                // כמה שורות מעלה, לפני ה-fetch) הוא ההודעה שהמשתמש ממש
                // כתב, שנקטעה באמצע השיחה הפתוחה. אותו מפתח כמו ב-
                // runCardAI - שחזור השאלה בטעינה הבאה לא מבדיל מאיפה
                // היא הגיעה, הוא פשוט מחזיר אותה לתיבה הראשונה (block-1) -
                // הדף עצמו נטען מחדש מלא אחרי קארדקום, אין "להמשיך שיחה
                // בדיוק מאותה נקודה" (שיחה/קלפים שנשלפו כבר אבדו).
                if (text) {
                    dcardSetLS(DCARD_LS_KEYS.pendingQuestion, text);
                }
                triggerPaymentWall();
                return;
            }

            if (data.aiReply) {
                appendMessage('ai', data.aiReply);
                // תיקון יחידת מדידה: הוסרה הספירה-לכל-הודעה שהייתה כאן -
                // "סשן" נספר פעם אחת, ברגע שהשיחה הפתוחה *מתחילה* (ר'
                // countSessionIfNeeded ב-btnPathChat/offerDeepenIntoChat),
                // לא בכל שאלת המשך בתוך אותה שיחה. בלי השורה הזו, כל
                // הודעה נוספת בשיחה הייתה מנופחת כ"סשן" נוסף.
                // הסוכן עצמו קובע מתי אין עוד מה לשאול (סימני הבנה, ר' שלב ט'
                // בהוראות) - זה יכול לקרות הרבה לפני השאלה ה-15, ואז אסור
                // להמשיך את השיחה רק כי המונה שלנו עוד לא הגיע למגבלה.
                agentEndedConversation = !!data.endSession;
                if (!isFinalTurn && !agentEndedConversation) {
                    maybeOfferAnotherCard(data.nextAction);
                }
            } else {
                // אותו תיקון כמו ב-runCardAI למעלה - לא מציגים טקסט שגיאה גולמי
                // מהשרת, וגם לא "נסה שוב" לבדו אם זה כשל שחוזר על עצמו.
                appendMessage('ai', 'אירעה שגיאה בקבלת תגובה. אפשר לנסות שוב, ואם זה חוזר על עצמו - מומלץ ללחוץ על "שאלה חדשה" ולהתחיל מחדש.');
            }
        } catch(e) {
            appendMessage('ai', 'אירעה שגיאה בתקשורת. אפשר לנסות שוב, ואם זה חוזר על עצמו - מומלץ ללחוץ על "שאלה חדשה" ולהתחיל מחדש.');
        } finally {
            // הנעילה תמיד קורית כאן (לא רק בענף ההצלחה) - גם אם התשובה חזרה
            // כשגיאה על השאלה ה-15, כדי שהמונה בפועל והמצב הנעול תמיד יסתנכרנו.
            if (creditsExhausted) {
                // לא נועלים עם הודעת "מקסימום שאלות" שגויה - פופאפ התשלום
                // (triggerPaymentWall) כבר הוצג, זה ההודעה הרלוונטית כאן.
            } else if (agentEndedConversation) {
                // תיקון: בוטלה ההודעה הנוספת כאן (הסוכן כבר כותב משפט סגירה
                // מפורש בתוך ההודעה שלו) - עדיין נועלים את תיבת הכתיבה.
                lockChatInput();
            } else if (isFinalTurn) {
                lockChatInput('הגעת למקסימום השאלות לקריאה זו. לקריאה חדשה לחץ על הכפתור למטה.');
            }
        }
    });

    // שליחה נוחה עם מקש Enter
    // keydown (לא keypress - מיושן ולא אמין בכל מקלדות מובייל/וירטואליות)
    chatInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            if (!e.shiftKey) {
                e.preventDefault();
                // בזמן הקלטה: Enter רק עוצר את ההקלטה ומציג את הטקסט שכבר
                // נכתב לתיבה (ע"י onresult) - לא שולח את ההודעה. המשתמש
                // יכול לבדוק/לערוך ואז ללחוץ Enter שוב (או "שלח") כשההקלטה
                // כבר עצרה.
                if (chatMicController && chatMicController.isRecording()) {
                    chatMicController.stop();
                    return;
                }
                btnSend.click();
            }
        }
    });

    // אותה נוחות ב-Enter בתיבת השאלה הראשונית (בלוק 1) - מדמה לחיצה על
    // כפתור הקופה (btnDeckAction: "ערבב קלפים"/"בחר קלף", לפי appState).
    // readOnly נבדק כי אחרי הנעילה (userQuestion.readOnly = true, ר' לחיצת
    // הכפתור למטה) אין יותר טעם להמשיך להאזין ל-Enter על השדה הנעול.
    // keydown (לא keypress) - אותה סיבה כמו ב-chatInput למעלה.
    userQuestion.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !userQuestion.readOnly) {
            if (!e.shiftKey) {
                e.preventDefault();
                // בזמן הקלטה: Enter רק עוצר אותה ומציג את הטקסט בתיבה - לא
                // מתחיל ערבוב. אותו היגיון כמו ב-chatInput למעלה.
                if (questionMicController && questionMicController.isRecording()) {
                    questionMicController.stop();
                    return;
                }
                // אם הסשן עוד לא הוקם (למשל: Enter נלחץ מיד עם טעינת העמוד,
                // לפני שהתשובה מ-/session/start חזרה) - לא מציגים את ה-alert
                // החוסם של btnDeckAction בשביל זה; פשוט מתעלמים מהלחיצה הזו,
                // בניגוד ללחיצה ידנית על הכפתור עצמו (שם ה-alert עדיין רלוונטי,
                // כי שם המשתמש בחר באופן יזום ללחוץ ולכן ראוי להסביר לו למה
                // שום דבר לא קרה).
                if (!sessionToken) return;
                btnDeckAction.click();
            }
        }
    });

    // 5. כפתורי סיום (מבוסס על סדר הכפתורים ב-HTML)
    // כפתור: סיום הסשן ויציאה
    endSessionBtns[0].addEventListener('click', async () => {
        if(confirm("האם אתה בטוח שברצונך לסיים את הסשן?")) {
            sessionEndedExplicitly = true; // ר' ההערה ליד ההכרזה - מונע כפילות מול מאזין ה-pagehide
            await fetch(`${API_BASE}/end`, {
                method: 'POST',
                headers: dcardHeaders(),
                body: JSON.stringify({ session_token: sessionToken, email: "", exit_type: 'explicit' })
            });

            // מסך סיום: מחליפים את כל #card-reader-app (כל הבלוקים 1-5) בתמונת
            // הקלף האחרון שנשלף + טקסט פרידה - זה העיצוב שהמשתמש ביקש לשחזר.
            // card-display:last-child נבחר מתוך cards-container (לא ממשתנה
            // נפרד) כדי לקבל בדיוק את התמונה שכבר מוצגת בפועל על המסך, בלי
            // תלות בפירוק/בנייה חדשה של ה-URL. אם מאיזושהי סיבה לא נשלף אף
            // קלף בסשן הזה (יצא לפני ששלף קלף ראשון) - מוצג רק הטקסט, בלי
            // תמונה שבורה.
            const lastCardImg = document.querySelector('#cards-container .card-display:last-child');
            const lastCardSrc = lastCardImg ? lastCardImg.src : '';
            cardReaderApp.innerHTML =
                '<div style="text-align:center; padding: 40px 20px;">' +
                (lastCardSrc ? '<img src="' + lastCardSrc + '" alt="קלף אחרון שנשלף" style="max-width:220px; width:100%; height:auto; border-radius:12px; margin-bottom:20px;" />' : '') +
                '<h3>תודה לך. אשמח שנתראה בקרוב.</h3>' +
                '</div>';

            // תיקון "מסך תקוע": מסך הסיום לעיל הושאר פתוח לצמיתות קודם, בלי
            // שום דרך חזרה - המשתמש פשוט נתקע עליו. השהיה של 2.5 שניות
            // *אחרי* שהמסך הזה כבר נראה (לא לפני) נותנת למשתמש רגע לקרוא את
            // הטקסט, ואז מפנה אותו החוצה לעמוד הבית במקום להשאיר אותו תקוע.
            setTimeout(function () {
                window.location.href = 'https://nuriteldar.co.il';
            }, 2500);
        }
    });

    // תיקון QA 3.2: ולידציה בסיסית - לא תחליף לאימות אמיתי (שליחת מייל עם
    // לינק אישור), רק סינון מוקדם של טעויות הקלדה ברורות לפני טרחת בקשה
    // לשרת. אותה בדיקה בדיוק ש-is_email() בצד השרת עדיין עושה בפועל.
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // כפתור: שליחת הדיאלוג במייל
    endSessionBtns[1].addEventListener('click', async () => {
        // אין כאן פופאפ אמיתי - prompt() הדפדפן, שתומך בערך ברירת מחדל
        // כפרמטר שני. אם כבר נשמרה כתובת מפעם קודמת, היא מוצגת מוכנה בתיבה.
        const savedEmail = dcardGetLS(DCARD_LS_KEYS.email) || '';
        const userEmail = prompt("לאיזו כתובת אימייל לשלוח את התיעוד?", savedEmail);
        if (!userEmail) return;

        if (!EMAIL_REGEX.test(userEmail.trim())) {
            alert("הכתובת שהוזנה לא נראית תקינה. נסה שוב.");
            return;
        }

        dcardSetLS(DCARD_LS_KEYS.email, userEmail);

        // תמונות הקלפים שנשלפו בפועל בסשן, לפי סדר השליפה - יוטמעו במייל.
        const cardImages = Array.from(document.querySelectorAll('#cards-container .card-display')).map(img => img.src);

        // תיקון QA 3.2: קודם הקריאה הזו לא נבדקה בכלל (לא try/catch, לא
        // בדיקת emailSent בתגובה) - המשתמש תמיד ראה "נשלח בהצלחה", גם אם
        // ה-fetch נכשל ברשת וגם אם wp_mail() נכשל בצד השרת (data.emailSent
        // === false). עכשיו שתי הדרכים האלה מדווחות בנפרד, בלי לטעון הצלחה
        // שלא קרתה בפועל.
        sessionEndedExplicitly = true; // ר' ההערה ליד ההכרזה - מונע כפילות מול מאזין ה-pagehide
        try {
            const res = await fetch(`${API_BASE}/end`, {
                method: 'POST',
                headers: dcardHeaders(),
                body: JSON.stringify({ session_token: sessionToken, email: userEmail, cardImages: cardImages, exit_type: 'explicit' })
            });
            const data = await res.json();
            if (data.emailSent) {
                alert("הדיאלוג נשלח בהצלחה לכתובת: " + userEmail);
            } else {
                alert("לא הצלחנו לשלוח את המייל לכתובת שהוזנה. אפשר לנסות שוב, או לוודא שהכתובת נכונה.");
            }
        } catch (e) {
            alert("אירעה שגיאת תקשורת ולא הצלחנו לשלוח את המייל. נסה שוב.");
        }
    });

    // תיקון (התבקש: לתעד "נטישה שקטה" - משתמש שמנהל שיחה ופשוט סוגר טאב/
    // מנווט הלאה, בלי ללחוץ על "סיום ויציאה"/"שליחת הדיאלוג במייל"/"שאלה
    // חדשה") - עד כה סשן כזה לא תועד בגיליון בכלל. pagehide (לא beforeunload -
    // אמין יותר במובייל/Safari, לא פותח דיאלוג אישור) נבחר כנקודת התפיסה
    // האחרונה האפשרית. sessionEndedExplicitly (ר' ההכרזה למעלה) מונע כפילות -
    // כל שלושת מסלולי הסיום המפורשים כבר מדווחים את עצמם, ומסמנים את הדגל
    // *לפני* שהם מנווטים/עושים reload (שגם הם מפעילים pagehide בעצמם).
    window.addEventListener('pagehide', function () {
        if (sessionToken && !sessionEndedExplicitly && navigator.sendBeacon) {
            const payload = new Blob(
                [JSON.stringify({ session_token: sessionToken, email: '', exit_type: 'abandoned' })],
                { type: 'application/json' }
            );
            navigator.sendBeacon(`${API_BASE}/end`, payload);
            sessionEndedExplicitly = true; // מגן גם מפני pagehide שמופעל יותר מפעם אחת
        }
    });

    // 6. משוב מאקרו (טקסט חופשי, שורת קלט בסטייל וואטסאפ) - בלוק 5.
    const feedbackMacroText = document.getElementById('feedback-macro-text');
    const btnFeedbackMacroSubmit = document.getElementById('btn-feedback-macro-submit');
    const feedbackMacroThanks = document.getElementById('feedback-macro-thanks');
    const feedbackMacroBar = document.querySelector('.feedback-macro-bar');

    // הרחבה אוטומטית (עד התקרה שנקבעה ב-CSS, max-height) - שורה אחת
    // כברירת מחדל, גדל רק אם המשתמש בפועל כותב הרבה. 'auto' לפני המדידה
    // כדי שהגובה יכול גם *להתכווץ* חזרה (למשל אחרי מחיקת טקסט), לא רק לגדול.
    feedbackMacroText.addEventListener('input', function () {
        feedbackMacroText.style.height = 'auto';
        feedbackMacroText.style.height = feedbackMacroText.scrollHeight + 'px';
    });

    btnFeedbackMacroSubmit.addEventListener('click', function () {
        const text = feedbackMacroText.value.trim();
        if (!text) return;

        btnFeedbackMacroSubmit.disabled = true; // מניעת שליחה כפולה - לפני ה-fetch, לא רק אחריו
        feedbackMacroText.disabled = true;

        fetch(`${FEEDBACK_API_BASE}/macro`, {
            method: 'POST',
            headers: dcardHeaders(),
            body: JSON.stringify({
                type: 'macro',
                session_id: sessionToken,
                text: text,
                flow_type: currentFlowType(),
                timestamp: new Date().toISOString()
            })
        }).then(function () {
            // מחליפים את כל ה-pill (לא רק שדה/כפתור בודדים) בהודעת התודה -
            // כך גם המיקרופון שבפנים נעלם בבת אחת, בלי שרידים ויזואליים.
            if (feedbackMacroBar) feedbackMacroBar.style.display = 'none';
            feedbackMacroThanks.style.display = 'block';
        }).catch(function (err) {
            console.warn('[DCard Feedback] macro feedback failed to send:', err);
            // משאירים את הטופס פתוח לניסיון חוזר - רק כשל ברשת, לא בחירת המשתמש
            btnFeedbackMacroSubmit.disabled = false;
            feedbackMacroText.disabled = false;
        });
    });
</script>
